apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      hostNetwork: true
      containers:
        - name: order-api
          image: changelens/order-api:phase-2-candidate
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - containerPort: 8080
